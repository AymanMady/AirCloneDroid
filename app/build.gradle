plugins {
    id 'com.android.application'
}

android {
    namespace 'de.fun2code.android.buildownpawserver'
    compileSdk 34

    defaultConfig {
        applicationId 'de.fun2code.android.buildownpawserver'
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    // Keep the original Eclipse/ADT source layout.
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*', 'LICENSE.txt', 'license.txt']
        }
    }
}

dependencies {
    implementation fileTree(dir: 'lib', include: ['*.jar'])
}
